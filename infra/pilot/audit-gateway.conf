worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 64k;
  server_tokens off;

  upstream immudb_tls {
    server audit-store:8080;
    keepalive 8;
  }

  server {
    listen 8080 ssl;
    server_name immudb localhost;
    ssl_certificate /run/secrets/audit-gateway/server.crt;
    ssl_certificate_key /run/secrets/audit-gateway/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name audit-store;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /run/secrets/audit-gateway/infrastructure-ca;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;

    location = /api/login {
      limit_except POST { deny all; }
      proxy_pass https://immudb_tls;
    }

    location = /api/db/use/fleetoryaudit {
      limit_except GET { deny all; }
      proxy_pass https://immudb_tls;
    }

    location = /api/db/set {
      limit_except POST { deny all; }
      proxy_pass https://immudb_tls;
    }

    location ~ ^/api/db/get/[A-Za-z0-9%+/=]+$ {
      limit_except GET { deny all; }
      proxy_pass https://immudb_tls;
    }

    location = /api/db/state {
      limit_except GET { deny all; }
      proxy_pass https://immudb_tls;
    }
    location = / { default_type text/plain; return 200 "TLS gateway ready\n"; }
    location / { return 404; }
  }
}
