name: Fleetory Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleetory-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Strict build, tests, coverage and Sonar
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME }}
      SONAR_QUALITYGATE_TIMEOUT: ${{ vars.SONAR_QUALITYGATE_TIMEOUT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          java -version

      - name: Run Fleetory quality verification
        shell: pwsh
        run: |
          .\eng\verify-quality.ps1
